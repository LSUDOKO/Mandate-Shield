  - generic [ref=f4e120]:
    - heading "What these numbers do not prove" [level=2] [ref=f4e121]
    - paragraph [ref=f4e122]: The benchmark is synthetic and self-authored. 100% shows the checks do what they claim against the attack classes they were built for. It is not evidence of robustness against a novel attack, and it should not be read that way. The catalog is mock data, and actor identity is modelled within a single process.
