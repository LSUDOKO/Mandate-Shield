  - region [ref=f4e70]:
    - heading "Five checks, all deterministic" [level=2] [ref=f4e71]
    - generic [ref=f4e72]:
      - article [ref=f4e73]:
        - generic [ref=f4e74]:
          - heading "What you see is what you sign" [level=3] [ref=f4e75]
          - generic [ref=f4e76]: T-7
        - paragraph [ref=f4e77]: The rendered total is parsed back to paise and compared against the signed payload, field by field. One paise of divergence blocks.
      - article [ref=f4e78]:
        - generic [ref=f4e79]:
          - heading "Field completeness" [level=3] [ref=f4e80]
          - generic [ref=f4e81]: T-6
        - paragraph [ref=f4e82]: Every field that affects cost or scope must trace to something the user actually said, or a default they pre-approved. A guess is not authorization.
      - article [ref=f4e83]:
        - generic [ref=f4e84]:
          - heading "Catalog stays data" [level=3] [ref=f4e85]
          - generic [ref=f4e86]: T-1 / T-4
        - paragraph [ref=f4e87]: Product text can populate a name and a price. It can never reach a spend cap. A listing that claims authorization is caught and named.
      - article [ref=f4e88]:
        - generic [ref=f4e89]:
          - heading "Nonce replay" [level=3] [ref=f4e90]
          - generic [ref=f4e91]: replay
        - paragraph [ref=f4e92]: Every nonce is recorded before settlement. A nonce that reappears blocks immediately, whatever else passed.
      - article [ref=f4e93]:
        - generic [ref=f4e94]:
          - heading "Actor identity" [level=3] [ref=f4e95]
          - generic [ref=f4e96]: T-29 / T-15
        - paragraph [ref=f4e97]: Roles are proven with an HMAC bound to the transaction, then checked against a deny-by-default matrix. Identity is never inferred from the channel.
  - generic [ref=f4e98]:
    - generic [ref=f4e99]:
      - heading "Blocking is not failing" [level=2] [ref=f4e100]
      - paragraph [ref=f4e101]: A held transaction becomes a Razorpay Payment Link, and the customer finishes the purchase with a normal UPI PIN or OTP. The agent is removed from the loop. The customer is not.
      - paragraph [ref=f4e102]: That asymmetry is why every check fails closed. A false positive costs a customer some friction. A false negative moves money nobody approved.
