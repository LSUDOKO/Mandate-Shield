    - generic [ref=f4e49]:
      - heading "The signature protects the wrong step" [level=2] [ref=f4e50]
      - paragraph [ref=f4e51]: Agentic payment protocols sign the cart. They do not protect the catalog data, tool results, and agent messages that decided what went into that cart in the first place. An attacker does not need to break the signature. They only need to change what the agent sees before it signs.
      - paragraph [ref=f4e52]:
        - text: 48 threats catalogued in
        - link "Beyond the Mandate (arXiv:2608.23858)" [ref=f4e53] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2608.23858
        - text: . Mandate Shield addresses five of them.
